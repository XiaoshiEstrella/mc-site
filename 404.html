<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#06090f" />
<title>404 · 这一块还没被探索 —— 老牧柿服务器</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334e0a0'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230d1524'/%3E%3Cpath d='M32 10 53 22v20L32 54 11 42V22z' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#06090f; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.11);
    --ink:#e8f0f8; --ink-2:#a9b8cb; --ink-3:#6f7f96;
    --brand:#34e0a0; --brand-2:#38bdf8;
    --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:var(--font); color:var(--ink); background:var(--bg); line-height:1.75;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .fx{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .fx::before{
    content:""; position:absolute; inset:-2px;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 50%,#000,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 50%,#000,transparent 80%);
  }
  .fx span{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; }
  .fx .a{ width:46vw; height:46vw; top:-14vw; left:-10vw; background:radial-gradient(circle,rgba(52,224,160,.34),transparent 68%); }
  .fx .b{ width:42vw; height:42vw; bottom:-16vw; right:-12vw; background:radial-gradient(circle,rgba(56,189,248,.28),transparent 68%); }
  .box{
    width:min(560px,100%); text-align:center; padding:44px 32px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--line); border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .code{
    font-family:var(--mono); font-size:clamp(60px,15vw,96px); font-weight:800; line-height:1;
    background:linear-gradient(120deg,#fff,var(--brand) 45%,var(--brand-2));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  h1{ font-size:20px; font-weight:800; margin:14px 0 8px; }
  p{ color:var(--ink-2); font-size:14.5px; }
  .addr{
    display:inline-flex; align-items:center; gap:8px; margin-top:22px;
    font-family:var(--mono); font-size:16px; font-weight:700; color:#fff;
    background:rgba(52,224,160,.10); border:1px solid rgba(52,224,160,.3);
    border-radius:12px; padding:10px 18px;
  }
  .btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700;
    padding:12px 22px; border-radius:12px; text-decoration:none; transition:.22s;
    color:#04140d; background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 10px 26px rgba(52,224,160,.24);
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn.ghost{ color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line); box-shadow:none; }
  .btn.ghost:hover{ border-color:rgba(52,224,160,.5); color:#fff; }
  .tip{ margin-top:20px; font-size:12.5px; color:var(--ink-3); }
</style>
</head>
<body>
  <div class="fx" aria-hidden="true"><span class="a"></span><span class="b"></span></div>
  <div class="box">
    <div class="code">404</div>
    <h1>这一块还没被探索</h1>
    <p>你要找的页面不在这里——可能被挖掉了，也可能只是地址敲错了一个字母。</p>
    <div class="addr">🌐 xiaoshi.cfd</div>
    <div class="btns">
      <a class="btn" href="./">返回首页</a>
      <a class="btn ghost" href="./#download">下载模组包</a>
    </div>
    <p class="tip">老牧柿服务器 · Minecraft 1.21.1 NeoForge</p>
  </div>
</body>
</html>
