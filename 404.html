<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#14171b" />
<meta name="color-scheme" content="dark" />
<title>404 · 这一块还没被探索 —— 老牧柿服务器</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233ecf8e'/%3E%3Cpath d='M16 6 26 11v10l-10 5L6 21V11z' fill='none' stroke='%230b1f14' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#14171b; --surface:#1c2026; --line:#2b3138; --line-strong:#3b434d;
    --ink:#e9edf2; --ink-2:#a7b0bd; --ink-3:#78838f;
    --brand:#3ecf8e; --brand-ink:#74dfa9;
    --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; min-height:100dvh; display:grid; place-items:center;
    padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    font-family:var(--font); color:var(--ink); line-height:1.7;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(62,207,142,.10), transparent 70%),
      radial-gradient(55% 45% at 90% 100%, rgba(160,140,255,.08), transparent 70%),
      var(--bg);
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  /* 网格纹理用渐变绘制，不用大尺寸 blur 滤镜 */
  .grid{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 50%,#000,transparent 80%);
    mask-image:radial-gradient(ellipse 85% 70% at 50% 50%,#000,transparent 80%);
  }
  .box{
    width:min(520px,100%); text-align:center; padding:clamp(28px,6vw,44px) clamp(20px,5vw,36px);
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 18px 48px rgba(0,0,0,.38);
  }
  .code{
    font-family:var(--mono); font-size:clamp(58px,15vw,92px); font-weight:800; line-height:1;
    letter-spacing:-2px; color:var(--brand-ink);
  }
  h1{ font-size:clamp(18px,4.5vw,21px); font-weight:800; margin:14px 0 8px; }
  p{ color:var(--ink-2); font-size:14px; }
  .addr{
    display:inline-flex; align-items:center; gap:8px; margin-top:22px;
    font-family:var(--mono); font-size:clamp(13px,3.6vw,15px); font-weight:700;
    color:var(--brand-ink); background:rgba(62,207,142,.10);
    border:1px solid rgba(62,207,142,.30); border-radius:11px; padding:9px 16px;
    overflow-wrap:anywhere;
  }
  .btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:44px;
    font-size:14px; font-weight:800; padding:10px 20px; border-radius:11px;
    text-decoration:none; transition:transform .16s, background .16s, border-color .16s;
    color:#062b12; background:var(--brand);
  }
  .btn:hover{ background:#52dd9e; }
  .btn.ghost{ color:var(--ink); background:transparent; border:1px solid var(--line-strong); }
  .btn.ghost:hover{ border-color:var(--brand); color:var(--brand-ink); }
  a:focus-visible{ outline:2px solid var(--brand); outline-offset:3px; }
  .tip{ margin-top:20px; font-size:12.5px; color:var(--ink-3); }
  @media (hover:hover){ .btn:hover{ transform:translateY(-2px); } }
  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.001ms !important; } }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main class="box">
    <div class="code">404</div>
    <h1>这一块还没被探索</h1>
    <p>你要找的页面不在这儿。可能被挖掉了，也可能只是地址敲错了一个字母。</p>
    <div class="addr">xiaoshicraft.cn</div>
    <div class="btns">
      <a class="btn" href="./">返回首页</a>
      <a class="btn ghost" href="./#download">下载模组包</a>
    </div>
    <p class="tip">老牧柿服务器 · Minecraft 1.21.1 NeoForge</p>
  </main>
</body>
</html>
